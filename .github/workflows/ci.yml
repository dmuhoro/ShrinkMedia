name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check / lint gate
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  android:
    name: Android (assembleDebug + JVM unit + androidTest compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Local JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compile instrumentation test APK
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Android release AAB (signed)
    runs-on: ubuntu-latest
    # Fail-closed release gate: only attempted on main, after web+android pass.
    # The `secrets` context is NOT valid in `if` expressions (job or step); it
    # is only readable via `env`. So we pass the signing secrets through a step
    # `env` and gate in shell: if any secret is empty, we build nothing and
    # produce no (unsigned) artifact. Never fail-open to an unsigned AAB.
    if: github.ref == 'refs/heads/main'
    needs: [web, android]
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-release-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build signed release AAB
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail closed: refuse to produce an artifact unless every signing
          # secret is present. keystore.properties/*.jks are gitignored and
          # recreated in CI only.
          if [ -z "$STORE_FILE" ] || [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice::Signing secrets not configured — signed release AAB skipped. Provision STORE_FILE/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD to enable it."
            exit 0
          fi
          # NOTE: app/build.gradle.kts resolves keystore.properties via
          # rootProject.file(...) (repo root) but interprets `storeFile` through
          # the PROJECT-relative `file(...)` inside the signingConfig, i.e. under
          # app/. So the decoded keystore must live at app/keystore.jks, not the
          # repo root, or validateSigningRelease fails ("keystore.jks not found").
          echo "$STORE_FILE" | base64 --decode > app/keystore.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties
          ./gradlew bundleRelease --no-daemon

      - name: Upload signed release AAB artifact
        # Secrets are not available in `if`; guard on the artifact instead so
        # we only upload when a real signed AAB was produced above.
        if: hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Merged release manifest carries NO INTERNET permission
        # Real-boundary privacy guard (AGENTS §1/§2): assert the FINAL merged
        # release manifest (what actually ships) has no android.permission.INTERNET.
        # The source manifest never declared it, so grepping source alone was a
        # false-confidence gate while ML Kit's transport-backend-cct merged it in.
        # tools:node="remove" strips it; this step fails if that ever regresses.
        run: |
          manifest=$(find app/build/intermediates/merged_manifest/release \
            -name AndroidManifest.xml 2>/dev/null | head -1)
          if [ -z "$manifest" ]; then
            echo "SKIP: no merged release manifest found"
            exit 0
          fi
          if rg -q "android\.permission\.INTERNET" "$manifest"; then
            echo "FAIL: android.permission.INTERNET present in merged release manifest ($manifest)"
            exit 1
          fi
          echo "PASS: merged release manifest declares no INTERNET permission"

  governance:
    name: Governance guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifest declares NO INTERNET permission
        run: |
          # android.permission.INTERNET is the real guard. The XML namespace
          # http://schemas.android.com/apk/res/android is mandatory and must
          # NOT trip this gate, so we match the permission declaration only.
          if rg -n "android\.permission\.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "FAIL: android.permission.INTERNET present in manifest"
            exit 1
          fi
          echo "PASS: manifest declares no INTERNET permission"

      - name: No real secrets committed
        run: |
          if git ls-files | rg -x '\.env$|\.env\.local$|\.env\.production$'; then
            echo "FAIL: a real .env file is tracked"
            exit 1
          fi
          echo "PASS: no real .env files tracked"

      - name: Evidence exists for current sprint
        run: |
          test -d docs/evidence && echo "PASS: evidence log present"
